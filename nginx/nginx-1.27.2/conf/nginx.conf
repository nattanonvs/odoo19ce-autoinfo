
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # Upstream for Odoo HTTP
    upstream odoo {
        server 127.0.0.1:8070;
    }

    # Upstream for Odoo Chat/websocket (longpolling)
    upstream odoo-chat {
        server 127.0.0.1:8072;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  pdev-erp.auto-info.com;

        # เพิ่มขนาด body สำหรับอัปโหลดไฟล์
        client_max_body_size 100M;

        # Log
        access_log  logs/odoo_access.log  main;

        # Websocket / Longpolling
        location /websocket {
            proxy_pass http://odoo-chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /longpolling {
            proxy_pass http://odoo-chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # หลัก - proxy ไปยัง Odoo
        location / {
            proxy_pass http://odoo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeout สำหรับรายงานและกระบวนการที่ใช้เวลานาน
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    600s;

            # Buffer
            proxy_buffers 16 64k;
            proxy_buffer_size 128k;
            proxy_busy_buffers_size 256k;
        }

        # error page
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

}
